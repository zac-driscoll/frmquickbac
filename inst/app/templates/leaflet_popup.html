<div style='
  font-family: Arial, sans-serif;
  font-size: 1.1rem;
  line-height: 1.5;
  border: 3px solid {Color};
  border-radius: 10px;
  padding: 10px 14px;
  background-color: rgba(255,255,255,0.9);
  color: #111;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
  max-width: 400px;
'>

  <div style='font-weight:bold; font-size:1.1rem; color:{Color}; margin-bottom:6px;'>
    Site: {Site}
  </div>
  <div style='font-size:1.1rem; color:black; margin-bottom:3px;'>
    {SiteDescription}
  </div>

  <hr style='border: none; border-top: 1px solid {Color}; margin: 10px 0;'>

  <table style='width:100%; border-collapse:collapse; text-align:center;'>
    <thead style='background-color:{Color}; color:white;'>
      <tr>
        <th style='padding:6px;font-size:0.9rem; '>Time</th>
        <th style='padding:6px;font-size:0.9rem;  '>Result</th>
        <th style='padding:6px;font-size:0.9rem; '>48-Hr Precip</th>
        <th style='padding:6px;font-size:0.9rem; '>Weather Station</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style='padding:6px; white-space:nowrap;'>{Time}</td>
        <td style='padding:6px; font-weight:bold;'>{round(Result, 2)}</td>
        <td style='padding:6px;'>{paste(Precip72Hr, 'in')}</td>
        <td style='padding:6px;'>{WeatherStation}</td>
      </tr>
    </tbody>
  </table>
</div>
