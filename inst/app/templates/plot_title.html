<div style="
  position:relative;
  background: linear-gradient(180deg, #F1F9FF 0%, #E6ECF4 100%);
  border-top: 1px solid #4b7591ff;
  border-left: 1px solid #4b7591ff;
  border-right: 1px solid #4b7591ff;
  border-radius: 14px 14px 0 0;
  padding: 14px 18px 16px 18px;
  text-align: center;
  font-family: Poppins, Arial, sans-serif;
  box-shadow: 0 8px 18px rgba(6,71,137,0.10);
">
  <span id="open_loc_map" role="button" tabindex="0" title="Open site & weather station map" style="
    position:absolute;
    top:14px;
    right:18px;

    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(6,71,137,0.12);
    border:1px solid rgba(6,71,137,0.28);
    cursor:pointer;
    font-size:1.20em;
    font-weight:600;
    color:#064789;
    box-shadow:0 6px 14px rgba(6,71,137,0.12);
    z-index:5;
  " onmouseenter="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 10px 20px rgba(6,71,137,0.18)'"
    onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 14px rgba(6,71,137,0.12)'">
    <i class="fa-solid fa-map-pin"></i>
    <span>See Map</span>
  </span>



  <!-- TITLE + SUBTITLE -->
  <div style="
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:center;
    height: 3em;
  ">
    <h3 style="
      margin:0;
      font-size:1.4em;
      color:#0A2B43;
      font-weight:700;
      letter-spacing:0.2px;
    ">
      {year} MMSD Water Quality Results
      <span style="color:#064789;">for {site}</span>
    </h3>

    <!-- SITE DESCRIPTION -->
    <div style="
      margin-top:2px;
      font-size:0.9em;
      color:#4b6b82;
      font-style:italic;
      max-width:900px;
      line-height:1.4;
      text-align:center;
    ">
      {SiteDescription}
    </div>
  </div>

  <!-- LEGEND -->
  <div style="
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    margin-top:14px;
    font-size:1.35em;
    flex-wrap:wrap;
  ">

    <!-- Current year -->
    <div style="
      display:flex;
      align-items:center;
      gap:8px;
      font-size:0.75em;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(6,71,137,0.08);
      border:1px solid rgba(6,71,137,0.18);
    ">
      <span style="
        width:12px; height:12px;
        border-radius:50%;
        background-color:#064789;
        display:inline-block;
        box-shadow:0 0 0 3px rgba(6,71,137,0.10);
      "></span>
      <span style="color:#064789; font-weight:700; font-size: 0.75em;">{year} Results</span>
    </div>

    <!-- Historic average -->
    <div style="
      display:flex;
      align-items:center;
      gap:8px;
      font-size:0.75em;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(14,119,14,0.08);
      border:1px solid rgba(14,119,14,0.18);
    ">
      <span style="
        width:14px; height:14px;
        border-radius:50%;
        background-color:#0e770eff;
        display:inline-block;
        box-shadow:0 0 0 3px rgba(14,119,14,0.10);
      "></span>

      <span
        style="color:#0e770eff; font-weight:700; font-size:0.75em; position:relative; display:inline-flex; align-items:center; gap:8px;">
        Historic Monthly Average

        <span style="
          cursor:help;
          position:relative;
          display:inline-flex;
          align-items:center;
          color:#0A2B43;
          opacity:0.85;
        " onmouseenter="this.querySelector('.tip').style.opacity='1'; this.querySelector('.tip').style.transform='translateY(0)'"
          onmouseleave="this.querySelector('.tip').style.opacity='0'; this.querySelector('.tip').style.transform='translateY(6px)'">
          <i class="fa-solid fa-circle-info" style="font-size:0.75em;"></i>

          <div class="tip" style="
            position:absolute;
            top:26px;
            left:50%;
            transform:translate(-50%, 6px);
            width:340px;
            padding:12px 14px;
            background:rgba(20,30,45,0.95);
            color:#fff;
            font-size:15px;
            line-height:1.45;
            border-radius:12px;
            box-shadow:0 14px 30px rgba(0,0,0,0.35);
            opacity:0;
            pointer-events:none;
            transition:opacity 0.15s ease, transform 0.15s ease;
            z-index:9999;
            text-align:left;
            border:1px solid rgba(255,255,255,0.12);
          ">
            <div style="font-weight:800; font-size:1.25em; margin-bottom:8px;">
              Historic Monthly Average
            </div>
            <div style="opacity:0.95;">
              Mean monthly value across all data included in the dataset.
            </div>
            <div style="margin-top:8px; font-style:italic; opacity:0.85;">
              Useful for identifying seasonal trends.
            </div>
          </div>

        </span>
      </span>
    </div>

  </div>
</div>
