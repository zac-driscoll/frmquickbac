<div style="background-color:#F1F9FF;
            border:1px solid #A9CCE3;
            border-radius:8px;
            padding:12px 16px;
            text-align:center;
            font-family:Poppins, Arial, sans-serif;">

  <h3 style="margin:0; font-size:2.3em; color:#064789;">
    {year} MMSD Water Quality Results for {site}
  </h3>

  <div style="display:flex;
              justify-content:center;
              align-items:center;
              gap:20px;
              margin-top:10px;
              font-size:1.5em;">

    <!-- Current year -->
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="width:16px; height:16px; border-radius:50%; background-color:#064789; display:inline-block;"></span>
      <span style="color:#064789; font-weight:600;">{year} Results</span>
    </div>

    <!-- Historic average + tooltip -->
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="width:16px; height:16px; border-radius:50%; background-color:#219E63; display:inline-block;"></span>

      <span style="color:#219E63; font-weight:600; position:relative;">
        Historic Monthly Average

        <span style="margin-left:6px;
                 cursor:help;
                 position:relative;" onmouseenter="this.querySelector('.tip').style.opacity='1'"
          onmouseleave="this.querySelector('.tip').style.opacity='0'">

          <i class="fa-solid fa-circle-info" style="font-size:16px;"></i>

          <div class="tip" style="
              position:absolute;
              top:24px;
              left:0;
              width:320px;
              padding:12px 14px;
              background:rgba(20,30,45,0.95);
              color:#fff;
              font-size:15px;
              line-height:1.45;
              border-radius:10px;
              box-shadow:0 10px 24px rgba(0,0,0,0.3);
              opacity:0;
              pointer-events:none;
              transition:opacity 0.15s ease;
              z-index:9999;
              text-align:left;
            ">
            <b style="font-size:16px;">Historic Monthly Average</b><br><br>
            This represents the mean monthly value for all of the data included within the dataset.<br><br>
            <i>Useful for identifying seasonal trends</i>
          </div>

        </span>
      </span>
    </div>

  </div>
</div>
