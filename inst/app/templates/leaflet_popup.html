<div style='
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  border: 3px solid {Color};
  border-radius: 10px;
  padding: 10px 14px;
  background-color: rgba(255,255,255,0.9);
  color: #111;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
  max-width: 360px;
'>

  <div style='font-weight:bold; font-size:18px; color:{Color}; margin-bottom:6px;'>
    Site: {Site}
  </div>
  <div style='font-size:16px; color:black; margin-bottom:3px;'>
    {SiteDescription}
  </div>

  <hr style='border: none; border-top: 1px solid {Color}; margin: 10px 0;'>

  <table style='width:100%; border-collapse:collapse; text-align:center;'>
    <thead style='background-color:{Color}; color:white;'>
      <tr>
        <th style='padding:6px;'>Result</th>
        <th style='padding:6px;'>72-Hr Precip</th>
        <th style='padding:6px;'>Hours Dry</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style='padding:6px; font-weight:bold;'>{round(Result, 2)}</td>
        <td style='padding:6px;'>{paste(Precip72Hr, 'in')}</td>
        <td style='padding:6px;'>{HoursDry}</td>
      </tr>
    </tbody>
  </table>
</div>
