<div style="font-family:Poppins, Arial, sans-serif; margin:21px auto; max-width:760px;">
  <div style="background:#ffffff;
           border:1px solid #e4eaf3;
           border-radius:16px;
           box-shadow:0 12px 28px rgba(0,0,0,0.06);
           padding:24px 28px;
           overflow:visible;">

    <table style="width:100%; border-collapse:collapse; font-size:18px; overflow:visible;">
      <thead>
        <tr style="background:#f5f9ff;">

          <!-- Metric -->
          <th style="text-align:left;
                     padding:12px 14px;
                     font-size:25px;
                     border-bottom:2px solid #dee6f2;">
            Metric
          </th>

          <!-- Current year -->
          <th style="text-align:right;
                     padding:12px 14px;
                     font-size:21px;
                     border-bottom:2px solid #dee6f2;
                     color:{current_color};">
            {current_year}
          </th>

          <!-- All + tooltip -->
          <th style="text-align:right;
                     padding:12px 14px;
                     font-size:22px;
                     border-bottom:2px solid #dee6f2;
                     color:{other_color};
                     position:relative;">

            All

            <span style="margin-left:6px;
                     cursor:help;
                     position:relative;" onmouseenter="this.querySelector('.tip').style.opacity='1'"
              onmouseleave="this.querySelector('.tip').style.opacity='0'">

              <i class="fa-solid fa-circle-info" style="font-size:16px;"></i>

              <div class="tip" style="
                  position:absolute;
                  top:24px;
                  right:0;
                  width:320px;
                  padding:12px 14px;
                  background:rgba(20,30,45,0.95);
                  color:#fff;
                  font-size:15px;
                  line-height:1.45;
                  border-radius:10px;
                  box-shadow:0 10px 24px rgba(0,0,0,0.3);
                  opacity:0;
                  pointer-events:none;
                  transition:opacity 0.15s ease;
                  z-index:9999;
                  text-align:left;
                ">
                <b style="font-size:16px;">All Data Definition</b><br><br>
                The values in the <b>All</b> column represent the corresponding metrics
                for the entire dataset, including the currently selected year.
              </div>

            </span>

          </th>
        </tr>
      </thead>

      <tbody>
        {rows_html}
      </tbody>
    </table>
  </div>
</div>
